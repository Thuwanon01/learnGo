<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เอกสารประกอบ — คอร์ส Go</title>
<link rel="stylesheet" href="assets/lesson.css">
<script src="assets/md.js"></script>
<style>
  main { max-width: 50rem; }

  .doclist { list-style: none; padding: 0; margin: 0 0 2rem; }
  .doclist li {
    border-top: 1px solid var(--rule);
    padding: 0.7rem 0;
    margin: 0;
  }
  .doclist li:first-child { border-top: none; }
  .doclist a { font-weight: 600; text-decoration: none; }
  .doclist a:hover { text-decoration: underline; }
  .doclist small {
    display: block;
    font-size: 0.86rem;
    color: var(--ink-soft);
    font-weight: 400;
    margin-top: 0.1rem;
  }

  #doc h1:first-child { margin-top: 0; }
  #doc blockquote {
    margin: 0 0 1.3rem;
    padding: 0.1rem 0 0.1rem 1.1rem;
    border-left: 3px solid var(--accent);
    color: var(--ink-soft);
  }
  #doc blockquote > :last-child { margin-bottom: 0; }
  #doc del { color: var(--ink-soft); }
  #doc hr { border: none; border-top: 1px solid var(--rule); margin: 2rem 0; }
</style>
</head>
<body>

<header>
  <p class="kicker" id="kicker">เอกสารประกอบ</p>
  <h1 id="doctitle">เอกสารประกอบ</h1>
</header>

<main>
  <div id="doc"></div>
</main>

<nav class="nav">
  <a href="index.html">🏠 สารบัญบทเรียน</a>
  <a href="docs.html">📚 เอกสารทั้งหมด</a>
  <a href="#" id="raw" hidden>ดูไฟล์ markdown ดิบ</a>
</nav>

<script>
/* ============================================================
   ตัวอ่านเอกสาร .md ของ workspace นี้
   ?f=<path>  → โหลดไฟล์นั้นมาแสดง   ไม่มี ?f= → แสดงสารบัญเอกสาร

   เพิ่มเอกสารใหม่ = เพิ่มหนึ่งบรรทัดใน DOCS ข้างล่าง (ไม่ต้องแตะที่อื่น)
   ตัวไฟล์ยังเป็น .md เหมือนเดิม แก้ที่ไฟล์เดียว เห็นผลทั้งบนเว็บและใน editor
   ============================================================ */
(function () {
  'use strict';

  var DOCS = [
    { group: 'เอกสารหลัก', file: 'GLOSSARY.md',
      title: '📖 GLOSSARY', desc: 'ศัพท์ที่ใช้ในคอร์สนี้ให้ตรงกัน — คำไหนห้ามใช้ เพราะอะไร' },
    { group: 'เอกสารหลัก', file: 'RESOURCES.md',
      title: '📚 RESOURCES', desc: 'แหล่งอ้างอิงที่ตรวจแล้ว + ชุมชน Go ที่เข้าได้' },
    { group: 'เอกสารหลัก', file: 'MISSION.md',
      title: '🎯 MISSION', desc: 'เรียนไปเพื่ออะไร — ใช้ตัดสินว่าจะสอนอะไรต่อ' },
    { group: 'เอกสารหลัก', file: 'NOTES.md',
      title: '📝 NOTES', desc: 'บันทึกการทำงาน: มาตรฐานของบทเรียน + backlog หัวข้อถัดไป' },

    { group: 'Learning records', file: 'learning-records/0001-starting-point.md',
      title: '0001 — จุดเริ่มต้น', desc: 'ตั้งต้นจากอะไร' },
    { group: 'Learning records', file: 'learning-records/0002-course-slides-have-errors.md',
      title: '0002 — สไลด์ของคอร์สมีจุดผิด', desc: 'จุดที่สไลด์ผิด 11 จุด พร้อมผลรันจริง' },
    { group: 'Learning records', file: 'learning-records/0003-workspace-restructure.md',
      title: '0003 — จัดโครงสร้าง workspace', desc: 'ทำไมถึงแยกเป็น day-N/' },
    { group: 'Learning records', file: 'learning-records/0004-day4-added.md',
      title: '0004 — เพิ่ม Day 4', desc: 'interface / error / JSON' },
    { group: 'Learning records', file: 'learning-records/0005-day5-added.md',
      title: '0005 — เพิ่ม Day 5', desc: 'testing ทั้งชุด' },
    { group: 'Learning records', file: 'learning-records/0006-day6-added.md',
      title: '0006 — เพิ่ม Day 6', desc: 'วันที่เนื้อหาโตเกินกรอบเดิม และวิธีรับมือ' },
    { group: 'Learning records', file: 'learning-records/0007-deploy-for-friends.md',
      title: '0007 — เปิดให้เพื่อนใช้', desc: 'สิ่งที่ต้องออกแบบเพิ่มตอนขึ้น GitHub + Vercel' },
    { group: 'Learning records', file: 'learning-records/0008-day7-added.md',
      title: '0008 — เพิ่ม Day 7', desc: 'ข้ามเนื้อหาซ้ำ และบทเรียนเรื่องการเชื่อผลตรวจจาก subagent' },
    { group: 'Learning records', file: 'learning-records/0009-day8-added.md',
      title: '0009 — เพิ่ม Day 8', desc: 'REST/Gin/Swagger 10 บท และวันที่ brief ของผมเองผิด แล้ว agent แก้ให้' }
  ];

  var box = document.getElementById('doc');
  var title = document.getElementById('doctitle');
  var kicker = document.getElementById('kicker');
  var raw = document.getElementById('raw');

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function showLibrary() {
    document.title = 'เอกสารประกอบ — คอร์ส Go';
    var groups = [];
    DOCS.forEach(function (d) {
      if (groups.indexOf(d.group) === -1) groups.push(d.group);
    });

    var html = ['<p class="standfirst">บันทึกและเอกสารอ้างอิงที่ใช้คู่กับบทเรียน ' +
                'เขียนเป็น markdown แล้วแสดงผลที่นี่ — เนื้อหาเดียวกับไฟล์ในรีโป</p>'];
    groups.forEach(function (g) {
      html.push('<h2>' + esc(g) + '</h2><ul class="doclist">');
      DOCS.filter(function (d) { return d.group === g; }).forEach(function (d) {
        html.push('<li><a href="docs.html?f=' + encodeURIComponent(d.file) + '">' +
                  esc(d.title) + '<small>' + esc(d.desc) + '</small></a></li>');
      });
      html.push('</ul>');
    });
    box.innerHTML = html.join('');
  }

  function fail(msg, extra) {
    box.innerHTML = '<div class="warn"><span class="label">เปิดไม่ได้</span><p>' + msg + '</p>' +
                    (extra || '') + '</div>';
  }

  var want = new URLSearchParams(location.search).get('f');

  if (!want) {
    showLibrary();
    return;
  }

  var doc = DOCS.filter(function (d) { return d.file === want; })[0];
  if (!doc) {
    title.textContent = 'ไม่รู้จักเอกสารนี้';
    fail('ไม่มีเอกสารชื่อ <code>' + esc(want) + '</code> ในรายการ — ' +
         'ดู <a href="docs.html">เอกสารทั้งหมด</a>');
    return;
  }

  /* ตัดอิโมจินำหน้าออกตอนใช้เป็นหัวเรื่อง แต่เก็บเลขที่ระบุ record ไว้ */
  var plain = doc.title.replace(/^[^\wก-๙]+\s*/, '');
  title.textContent = plain;
  kicker.textContent = doc.group;
  document.title = plain + ' — คอร์ส Go';
  raw.href = doc.file;
  raw.hidden = false;

  /* เปิดจากไฟล์ในเครื่องตรง ๆ (file://) เบราว์เซอร์บล็อก fetch ด้วย CORS
     — ไม่ใช่บั๊ก แต่ต้องบอกทางออกให้ชัด */
  if (location.protocol === 'file:') {
    fail('เปิดหน้านี้จากไฟล์ในเครื่องโดยตรง เบราว์เซอร์จึงไม่ยอมให้อ่าน ' +
         '<code>' + esc(doc.file) + '</code> (นโยบาย CORS ของ <code>file://</code>)',
         '<p style="margin:0">ทางออก: เปิดผ่านเว็บที่ deploy ไว้ ' +
         'หรือรันเซิร์ฟเวอร์ในโฟลเดอร์นี้ด้วย <code>python3 -m http.server 8000</code> ' +
         'แล้วเปิด <code>localhost:8000/docs.html</code><br>' +
         'หรือกด <a href="' + doc.file + '">ดูไฟล์ markdown ดิบ</a> ก็ได้</p>');
    return;
  }

  box.innerHTML = '<p class="meta">กำลังโหลด…</p>';

  fetch(doc.file)
    .then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.text();
    })
    .then(function (text) {
      box.innerHTML = window.renderMarkdown(text);
      /* h1 ของไฟล์ซ้ำกับหัวหน้าเพจ ตัดทิ้งอันในเนื้อหา */
      var h1 = box.querySelector('h1');
      if (h1 && h1 === box.firstElementChild) {
        title.textContent = h1.textContent;
        document.title = h1.textContent + ' — คอร์ส Go';
        h1.remove();
      }
      if (location.hash) {
        var target = document.getElementById(location.hash.slice(1));
        if (target) target.scrollIntoView();
      }
    })
    .catch(function (err) {
      fail('อ่าน <code>' + esc(doc.file) + '</code> ไม่สำเร็จ (' + esc(err.message) + ')',
           '<p style="margin:0"><a href="' + doc.file + '">ลองเปิดไฟล์ดิบโดยตรง</a></p>');
    });
})();
</script>

</body>
</html>
